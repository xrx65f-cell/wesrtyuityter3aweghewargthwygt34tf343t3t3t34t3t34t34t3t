; KillForHonor TEST_LEAN_8 - Story Mode
; Switches: 1=On, 0=Off. Times are in milliseconds.
; Keep beside KillForHonor.asi. Restart the game after editing.

[General]
; Enable the mod.
Enabled=1

[HonorGain]
; Reward enemy kills and prevent those targets' combat honor penalties.
; 0=Disable both features and NPC scanning.
Enabled=1
; Points per enemy human kill, including hostile lawmen. Range: 1-100.
HonorPerHumanKill=3
; Also reward hostile animals, including enemy dogs.
; Combat protection stays active when this option is 0.
RewardHostileAnimals=1
; Points per hostile animal kill. Range: 1-100.
HonorPerHostileAnimalKill=3
; 1=Use the chapter cap; 0=Use the maximum cap (320).
RespectChapterHonorCap=1

[Notification]
; Always show '+' without a number, including at the honor cap.
ShowHonorIcon=1
PlayHonorBell=1
; Minimum time between reward notifications. Range: 450-5000.
IntervalMs=700

[Advanced]
; NPC scan interval. Range: 0-500; 0=Every frame.
; Higher values reduce work but increase the chance of missing quick kills.
RewardScanIntervalMs=50
; Remember a known enemy while injured or knocked out. Range: 0-60000.
; Healthy NPCs stop qualifying as soon as their enemy/combat state clears.
IncapacitatedEnemyMemoryMs=10000

[Logging]
; 1=Log honor events and victims (default); 0=Off, lower overhead.
Enabled=1
